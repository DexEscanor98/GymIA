<html lang="es">
  <meta charset="utf-8" /><meta

  /><title>Gymia · Sin conexión</title
  ><style>
    body {
      margin: 0;

  <main>

    </p>
    <button onclick="location.reload()">Intentar de nuevo</button>
  </main>
